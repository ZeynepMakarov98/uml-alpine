name: uml-alpine

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  uml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev wget xz-utils cpio

      - name: Download Linux kernel source
        run: |
          KVER=$(curl -fsSL https://www.kernel.org/releases.json | jq -r .latest_stable.version)
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          curl -fsSL "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$KVER.tar.xz" | tar -xJ
          mv "linux-$KVER" linux-src

      - name: Assemble Alpine initramfs
        run: |
          AVER=$(curl -fsSL https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/ \
                | grep -oP 'alpine-minirootfs-\K[0-9.]+(?=-x86_64\.tar\.gz)' | head -1)
          echo "AVER=$AVER" >> "$GITHUB_ENV"
          mkdir -p rootfs
          curl -fsSL "https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/alpine-minirootfs-$AVER-x86_64.tar.gz" \
            | tar -xz -C rootfs
          mkdir -p rootfs/proc rootfs/sys rootfs/dev
          cat > rootfs/init <<'SCRIPT'
#!/bin/sh
mount -t proc none /proc
mount -t sysfs none /sys
mount -t devtmpfs none /dev 2>/dev/null
echo '=============================================='
echo '=== ALPINE BOOTED INSIDE UML ==='
cat /etc/alpine-release
uname -a
head -3 /etc/os-release
apk --version
echo '=== UML-ALPINE-TEST-PASSED ==='
poweroff -f
SCRIPT
          chmod +x rootfs/init
          echo "initramfs: $(du -sh rootfs | cut -f1)"

      - name: Build UML kernel with Alpine embedded
        run: |
          cd linux-src
          make ARCH=um defconfig
          scripts/config --file .config -e BLK_DEV_INITRD -e RD_GZIP \
            --set-str INITRAMFS_SOURCE "$GITHUB_WORKSPACE/rootfs"
          make ARCH=um olddefconfig
          make ARCH=um -j"$(nproc)"
          ls -lh linux

      - name: Boot Alpine inside UML
        run: |
          timeout 240 ./linux-src/linux mem=256M con0=fd:0,fd:1 > uml.log 2>&1 || true
          echo "----- UML boot log -----"
          tail -40 uml.log
          grep -q '=== ALPINE BOOTED INSIDE UML ===' uml.log \
            || { echo "::error::UML never booted Alpine"; exit 1; }
          grep -q 'apk-tools' uml.log \
            || { echo "::error::Alpine userspace unhealthy"; exit 1; }
          echo "::notice::UML ran Linux $KVER with Alpine $AVER inside this GitHub Actions job"
