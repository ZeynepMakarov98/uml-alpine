name: uml-alpine

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cmd:
        description: 'Custom command to run inside Alpine (UML guest)'
        required: false
        default: 'wget -q -O - http://example.com > /tmp/example.html && echo NETWORK-OK: got $(wc -c < /tmp/example.html) bytes from example.com'
        type: string
      timeout_sec:
        description: 'Run the command for up to this many seconds'
        required: false
        default: '30'
        type: string

jobs:
  uml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          for i in $(seq 1 6); do
            sudo apt-get install -y bc bison flex libssl-dev libelf-dev wget xz-utils cpio jq dwarves && break
            sleep 20
          done

      - name: Resolve custom command and time limit
        run: |
          CMD="${{ inputs.cmd }}"
          TLIM="${{ inputs.timeout_sec }}"
          [ -z "$CMD" ] && CMD='wget -q -O - http://example.com > /tmp/example.html && echo NETWORK-OK: got $(wc -c < /tmp/example.html) bytes from example.com'
          [ -z "$TLIM" ] && TLIM=30
          echo "CMDB64=$(printf '%s' "$CMD" | base64 -w0)" >> "$GITHUB_ENV"
          echo "TLIM=$TLIM" >> "$GITHUB_ENV"
          echo "::notice::will run in UML guest for up to ${TLIM}s: $CMD"

      - name: Resolve latest stable kernel
        run: |
          curl -fsSL https://www.kernel.org/releases.json -o releases.json
          KVER=$(jq -r '[.releases[] | select(.version | startswith("6.12."))][0].version' releases.json)
          [ -z "$KVER" ] && KVER=6.12.117
          KURL=$(jq -r --arg v "$KVER" '.releases[] | select(.version==$v) | .source' releases.json | head -1)
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          echo "KURL=$KURL" >> "$GITHUB_ENV" 
      - name: Download Linux kernel source
        run: |
          curl -fsSL "$KURL" | tar -xJ
          mv "linux-$KVER" linux-src

      - name: Assemble Alpine initramfs
        run: |
          AVER=$(curl -fsSL https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/ | grep -oP 'alpine-minirootfs-\K[0-9.]+(?=-x86_64\.tar\.gz)' | head -1)
          echo "AVER=$AVER" >> "$GITHUB_ENV"
          mkdir -p rootfs
          curl -fsSL "https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/alpine-minirootfs-$AVER-x86_64.tar.gz" | tar -xz -C rootfs
          mkdir -p rootfs/proc rootfs/sys rootfs/dev
          echo '' | base64 -d > rootfs/init
          chmod +x rootfs/init
          sudo mkdir -p rootfs/dev
          sudo mknod -m 600 rootfs/dev/console c 5 1
          sudo mknod -m 666 rootfs/dev/tty0 c 4 0
          sudo mknod -m 666 rootfs/dev/null c 1 3
          du -sh rootfs

      - name: Build UML kernel with Alpine embedded and tap net
        run: |
          cd linux-src
          make ARCH=um defconfig
          scripts/config --file .config -e BLK_DEV_INITRD -e RD_GZIP -e UML_NET -e UML_NET_VECTOR -e UML_NET_TUNTAP --set-str INITRAMFS_SOURCE "$GITHUB_WORKSPACE/rootfs"
          make ARCH=um olddefconfig
          make ARCH=um -j"$(nproc)"
          ls -lh linux
          grep -E '^CONFIG_UML_NET=|^CONFIG_UML_NET_VECTOR=|^CONFIG_UML_NET_TUNTAP=' .config

      - name: Set up host-side tap bridge with NAT
        run: |
          modprobe tun 2>/dev/null || true
          sudo chmod 666 /dev/net/tun
          sudo ip tuntap add dev tap0 mode tap user $(id -un)
          sudo ip link set tap0 up
          sudo ip addr add 10.0.2.1/24 dev tap0
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo iptables -t nat -A POSTROUTING -s 10.0.2.0/24 -o eth0 -j MASQUERADE
          sudo iptables -A FORWARD -i tap0 -o eth0 -j ACCEPT
          sudo iptables -A FORWARD -i eth0 -o tap0 -m state --state RELATED,ESTABLISHED -j ACCEPT
          ip -4 addr show tap0
      - name: Boot Alpine inside UML and run custom command
        timeout-minutes: 10
        run: |
          timeout $((TLIM + 180)) sudo ./linux-src/linux mem=256M con0=fd:0,fd:1 eth0=tuntap,tap0,de:ad:be:ef:00:01 cmdb64=$CMDB64 tlim=$TLIM > uml.log 2>&1 || true
          echo "----- UML boot log -----"
          tail -80 uml.log
          grep -q '=== ALPINE BOOTED INSIDE UML' uml.log || { echo '::error::UML never booted Alpine'; exit 1; }
          grep -q 'cmd exit code: 0' uml.log || { echo '::error::custom command finished with a non-zero status'; exit 1; }
          grep -q 'Power down' uml.log || { echo '::error::guest did not power down cleanly'; exit 1; }
          echo "::notice::custom command ran inside Alpine $AVER on UML kernel $KVER over tap+NAT"
