name: u7
on:
  push:
    branches: [main]
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: b
        run: |
          mkfifo console_in
          ( cat console_in | ./linux > uml.log 2>&1 ) &
          UML_PID=$!
          exec 3> console_in
          for i in $(seq 1 60); do grep -q 'dropping to guest shell' uml.log 2>/dev/null || true; sleep 1; done
          sleep 2
          echo 'echo hello' >&3
          for i in $(seq 1 30); do grep -qE '^hello\r?$' uml.log 2>/dev/null || true; sleep 1; done
          echo 'cat /etc/alpine-release' >&3
          sleep 2
          echo 'uname -r' >&3
          sleep 2
          echo 'poweroff -f' >&3
          timeout 120 wait $UML_PID || true
          exec 3>&-
          echo "----- UML console transcript -----"
          tail -60 uml.log
