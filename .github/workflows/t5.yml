name: t5
on:
  push:
    branches: [main]
jobs:
  uml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build UML kernel with Alpine embedded
        run: |
          cd linux-src
          make ARCH=um defconfig
          scripts/config --file .config -e BLK_DEV_INITRD -e RD_GZIP \
            --set-str INITRAMFS_SOURCE "$GITHUB_WORKSPACE/rootfs"
          make ARCH=um olddefconfig
          make ARCH=um -j"$(nproc)"
          ls -lh linux

