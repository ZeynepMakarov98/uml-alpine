name: t4
on:
  push:
    branches: [main]
jobs:
  uml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Alpine initramfs
        run: |
          AVER=$(curl -fsSL https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/ \
                | grep -oP 'alpine-minirootfs-\K[0-9.]+(?=-x86_64\.tar\.gz)' | head -1)
          echo "AVER=$AVER" >> "$GITHUB_ENV"
          mkdir -p rootfs
          curl -fsSL "https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/alpine-minirootfs-$AVER-x86_64.tar.gz" \
            | tar -xz -C rootfs
          mkdir -p rootfs/proc rootfs/sys rootfs/dev
          cat > rootfs/init <<'SCRIPT'
#!/bin/sh
mount -t proc none /proc
mount -t sysfs none /sys
mount -t devtmpfs none /dev 2>/dev/null
echo '=============================================='
echo '=== ALPINE BOOTED INSIDE UML ==='
cat /etc/alpine-release
uname -a
head -3 /etc/os-release
apk --version
echo '=== UML-ALPINE-TEST-PASSED ==='
poweroff -f
SCRIPT
          chmod +x rootfs/init
          echo "initramfs: $(du -sh rootfs | cut -f1)"

