name: uml-benchmark

on:
  workflow_dispatch:
    inputs:
      timeout_sec:
        description: 'Max seconds for the guest benchmark command (0 = no limit)'
        required: false
        default: '300'
        type: string

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Alpine rootfs for fair comparison (host chroot)
        run: |
          set -e
          AVER=$(curl -fsSL https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/ | grep -oP 'alpine-minirootfs-\K[0-9.]+(?=-x86_64\.tar\.gz)' | head -1)
          echo "AVER=$AVER" >> "$GITHUB_ENV"
          sudo mkdir -p /alpine
          curl -fsSL "https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/alpine-minirootfs-$AVER-x86_64.tar.gz" | sudo tar -xz -C /alpine
          sudo mkdir -p /alpine/proc /alpine/sys /alpine/dev /alpine/tmp
          sudo mount --bind /proc /alpine/proc
          sudo mount --bind /sys /alpine/sys
          sudo mount --bind /dev /alpine/dev
          sudo cp /etc/resolv.conf /alpine/etc/resolv.conf

      - name: Write benchmark script
        run: |
          cat > /tmp/bench.sh <<'BENCH'
          #!/bin/sh
          set -e
          LABEL="$1"
          echo "===== ${LABEL} BENCHMARK START ====="
          echo "kernel: $(uname -r)"
          if [ -f /etc/alpine-release ]; then echo "distro: Alpine $(cat /etc/alpine-release)"; elif [ -f /etc/os-release ]; then . /etc/os-release; echo "distro: $PRETTY_NAME"; else echo "distro: unknown"; fi
          echo "nproc: $(nproc)  processors: $(grep -c '^processor' /proc/cpuinfo 2>/dev/null || echo ?)"
          echo "mem_total_kb: $(grep MemTotal /proc/meminfo 2>/dev/null | awk '{print $2}' || echo unknown)"
          echo "cpu_model: $(grep -m1 'model name' /proc/cpuinfo 2>/dev/null | cut -d: -f2 | sed 's/^ //' || echo unknown)"

          now_ms() { awk '{printf "%d", $1*1000}' /proc/uptime 2>/dev/null || date +%s%3N 2>/dev/null || echo $(($(date +%s)*1000)); }

          run3() {
            name="$1"; shift
            v1=$("$@"); v2=$("$@"); v3=$("$@")
            avg=$(( (v1 + v2 + v3) / 3 ))
            echo "${name}_ms_run1=${v1} ${name}_ms_run2=${v2} ${name}_ms_run3=${v3} ${name}_ms_avg=${avg}"
          }

          bench_cpu_loop() { t0=$(now_ms); i=0; while [ "$i" -lt 1000000 ]; do i=$((i+1)); done; t1=$(now_ms); echo $((t1-t0)); }
          bench_sha() { t0=$(now_ms); dd if=/dev/zero bs=1M count=64 2>/dev/null | sha256sum >/tmp/sha.out; t1=$(now_ms); echo $((t1-t0)); }
          bench_fork() { t0=$(now_ms); i=0; while [ "$i" -lt 2000 ]; do /bin/true; i=$((i+1)); done; t1=$(now_ms); echo $((t1-t0)); }
          bench_write() { t0=$(now_ms); dd if=/dev/zero of=/tmp/iotest bs=1M count=64 conv=fsync 2>/dev/null; t1=$(now_ms); echo $((t1-t0)); }
          bench_read() { t0=$(now_ms); dd if=/tmp/iotest of=/dev/null bs=1M 2>/dev/null; t1=$(now_ms); echo $((t1-t0)); }
          bench_spawn_sh() { t0=$(now_ms); i=0; while [ "$i" -lt 2000 ]; do sh -c ':'; i=$((i+1)); done; t1=$(now_ms); echo $((t1-t0)); }

          echo "--- CPU: integer loop (1,000,000 iters, sh arithmetic) ---"
          run3 cpu_loop bench_cpu_loop

          echo "--- CPU: sha256sum 64 MiB from /dev/zero ---"
          run3 sha256_64MiB bench_sha
          echo "sha256: $(cat /tmp/sha.out)"

          echo "--- SYSCALL/PROC: fork+exec /bin/true (2,000 times) ---"
          run3 fork_exec_2000 bench_fork

          echo "--- SYSCALL/PROC: spawn sh -c ':' (2,000 times) ---"
          run3 spawn_sh_2000 bench_spawn_sh

          echo "--- IO: write 64 MiB to /tmp (dd, fsync) ---"
          run3 write_64MiB bench_write

          echo "--- IO: read 64 MiB from /tmp (dd) ---"
          run3 read_64MiB bench_read
          rm -f /tmp/iotest

          echo "--- NET: fetch example.com ---"
          t0=$(now_ms); wget -qO /tmp/bench.html http://example.com 2>/dev/null || wget -qO- http://example.com >/tmp/bench.html 2>/dev/null || true; t1=$(now_ms)
          echo "net_bytes=$(wc -c < /tmp/bench.html 2>/dev/null || echo 0) net_fetch_ms=$((t1-t0))"

          echo "===== ${LABEL} BENCHMARK END ====="
          BENCH
          chmod +x /tmp/bench.sh
          sudo cp /tmp/bench.sh /alpine/bench.sh
          sudo chmod +x /alpine/bench.sh

      - name: Native benchmark (host, Ubuntu userspace)
        run: |
          /tmp/bench.sh "NATIVE-HOST"

      - name: Native benchmark (host kernel, Alpine userspace via chroot)
        run: |
          sudo chroot /alpine /bin/sh /bench.sh "NATIVE-ALPINE-CHROOT"

      - name: Install build deps
        run: |
          sudo apt-get update
          for i in $(seq 1 6); do
            sudo apt-get install -y bc bison flex libssl-dev libelf-dev wget xz-utils cpio jq dwarves && break
            sleep 20
          done

      - name: Resolve time limit
        env:
          TLIM_IN: ${{ inputs.timeout_sec }}
        run: |
          TLIM="$TLIM_IN"
          [ -z "$TLIM" ] && TLIM=300
          echo "CMDB64=$(printf '%s' 'echo benchmark' | base64 -w0)" >> "$GITHUB_ENV"
          echo "TLIM=$TLIM" >> "$GITHUB_ENV"
          echo "::notice::benchmark guest time limit: ${TLIM}s (0 = no limit)"

      - name: Resolve latest stable kernel
        run: |
          curl -fsSL https://www.kernel.org/releases.json -o releases.json
          KVER=$(jq -r '.latest_stable.version' releases.json)
          KURL=$(jq -r --arg v "$KVER" '.releases[] | select(.version==$v) | .source' releases.json | head -1)
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          echo "KURL=$KURL" >> "$GITHUB_ENV"

      - name: Download Linux kernel source
        run: |
          curl -fsSL "$KURL" | tar -xJ
          mv "linux-$KVER" linux-src

      - name: Assemble Alpine initramfs with benchmark script
        run: |
          sudo umount /alpine/dev /alpine/sys /alpine/proc 2>/dev/null || true
          mkdir -p rootfs
          # reuse Alpine rootfs prepared earlier
          sudo tar -C /alpine --exclude='./proc' --exclude='./sys' --exclude='./dev' --exclude='./bench.sh' -cf - . | tar -C rootfs -xf -
          mkdir -p rootfs/proc rootfs/sys rootfs/dev
          cp /tmp/bench.sh rootfs/bench.sh
          chmod +x rootfs/bench.sh
          cat > rootfs/run.sh <<'RUN'
          #!/bin/sh
          /bin/sh /bench.sh "UML"
          RUN
          chmod +x rootfs/run.sh
          cat > /tmp/init_net.sh <<'INIT'
          #!/bin/sh
          mount -t devtmpfs none /dev 2>/dev/null
          mount -t proc none /proc
          mount -t sysfs none /sys
          echo '=== ALPINE BOOTED INSIDE UML (benchmark) ==='
          cat /etc/alpine-release
          TLIM=$(sed -n 's/.*tlim=\([0-9]*\).*/\1/p' /proc/cmdline)
          [ -z "$TLIM" ] && TLIM=30
          CMD='/run.sh'
          ifconfig lo 127.0.0.1 up 2>/dev/null || true
          NETIF=""; i=0
          while [ "$i" -lt 30 ]; do
            for d in /sys/class/net/eth0 /sys/class/net/vec0; do
              if [ -e "$d" ]; then NETIF=$(basename "$d"); break; fi
            done
            [ -n "$NETIF" ] && break
            i=$((i+1)); sleep 1
          done
          if [ -n "$NETIF" ]; then
            ifconfig "$NETIF" 10.0.2.15 netmask 255.255.255.0 up 2>/dev/null || true
            route add default gw 10.0.2.1 2>/dev/null || true
          fi
          echo 'nameserver 1.1.1.1' > /etc/resolv.conf
          echo 'nameserver 8.8.8.8' >> /etc/resolv.conf
          if [ "$TLIM" = "0" ]; then echo "--- running (no time limit): $CMD ---"; else echo "--- running (time limit ${TLIM}s): $CMD ---"; fi
          /bin/sh /run.sh &
          CPID=$!; RC=124
          if [ "$TLIM" = "0" ]; then
            wait "$CPID"; RC=$?
          else
            i=0
            while [ "$i" -lt "$TLIM" ]; do i=$((i+1)); kill -0 "$CPID" 2>/dev/null || break; sleep 1; done
            if kill -0 "$CPID" 2>/dev/null; then kill -9 "$CPID" 2>/dev/null; wait "$CPID" 2>/dev/null; echo "--- time limit reached (${TLIM}s) ---"; RC=124; else wait "$CPID"; RC=$?; fi
          fi
          echo "--- cmd exit code: $RC ---"
          [ "$RC" -eq 0 ] && echo '=== UML-ALPINE-TEST-PASSED ==='
          poweroff -f
          INIT
          cp /tmp/init_net.sh rootfs/init
          chmod +x rootfs/init
          sudo mkdir -p rootfs/dev
          sudo mknod -m 600 rootfs/dev/console c 5 1
          sudo mknod -m 666 rootfs/dev/tty0 c 4 0
          sudo mknod -m 666 rootfs/dev/null c 1 3

      - name: Build UML kernel with Alpine embedded and vector net
        run: |
          cd linux-src
          make ARCH=um defconfig
          scripts/config --file .config \
            -e BLK_DEV_INITRD -e RD_GZIP -e UML_NET -e UML_NET_VECTOR -e SMP \
            --set-val NR_CPUS 8 \
            --set-str INITRAMFS_SOURCE "$GITHUB_WORKSPACE/rootfs" \
            -d DEBUG_INFO -d DEBUG_KERNEL -d DEBUG_FS -d KCOV -d KGDB \
            -e CC_OPTIMIZE_FOR_PERFORMANCE
          make ARCH=um olddefconfig
          make ARCH=um -j"$(nproc)"

      - name: Set up host veth pair and NAT
        run: |
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo ip link add veth0 type veth peer name veth0p
          sudo ip addr add 10.0.2.1/24 dev veth0
          sudo ip link set veth0 up
          sudo ip link set veth0p up
          sudo iptables -t nat -A POSTROUTING -s 10.0.2.0/24 -o eth0 -j MASQUERADE
          sudo iptables -A FORWARD -i veth0 -o eth0 -j ACCEPT
          sudo iptables -A FORWARD -i eth0 -o veth0 -m state --state RELATED,ESTABLISHED -j ACCEPT

      - name: Boot UML and run benchmark (optimized)
        timeout-minutes: 30
        run: |
          MIN=3072; MAX=3584; STEP=64
          N=$(( (MAX - MIN) / STEP + 1 ))
          MEM=$(( MIN + (RANDOM % N) * STEP ))
          NCPU=$(nproc)
          echo "::notice::benchmark alloc ${MEM}M RAM, ncpus=${NCPU}, tlim=${TLIM} (optimized: tmpfs+pinning+quiet)"
          # Back UML guest RAM with tmpfs (and try hugepages) for better memory locality/perf
          sudo mkdir -p /mnt/uml-mem
          sudo mount -t tmpfs -o "size=$((MEM + 512))M,huge=within_size" tmpfs /mnt/uml-mem 2>/dev/null || \
            sudo mount -t tmpfs -o "size=$((MEM + 512))M" tmpfs /mnt/uml-mem
          UMID=umlrun
          UMID_DIR="/root/.uml/$UMID"
          # Pin to a fixed CPU set to reduce migration/cache/TLB thrash
          MAXCPU=$((NCPU-1))
          CPUSET="0-${MAXCPU}"
          UML_CMD="./linux-src/linux umid=$UMID mem=${MEM}M ncpus=${NCPU} seccomp=on quiet loglevel=4 mitigations=off con0=fd:0,fd:1 cmdb64=$CMDB64 tlim=$TLIM"
          if [ "$TLIM" = "0" ]; then
            sudo env TMPDIR=/mnt/uml-mem TMP=/mnt/uml-mem taskset -c "$CPUSET" stdbuf -oL -eL $UML_CMD > uml.log 2>&1 &
          else
            sudo env TMPDIR=/mnt/uml-mem TMP=/mnt/uml-mem taskset -c "$CPUSET" stdbuf -oL -eL timeout $((TLIM + 180)) $UML_CMD > uml.log 2>&1 &
          fi
          UMLPID=$!
          for i in $(seq 1 90); do
            if sudo test -S "$UMID_DIR/mconsole"; then
              echo "mconsole socket: $UMID_DIR/mconsole"
              echo '' | base64 -d | sudo python3 - "$UMID_DIR/mconsole"
              break
            fi
            sleep 1
          done
          wait $UMLPID || true
          echo "----- UML BENCHMARK RESULTS -----"
          sed -n '/===== UML BENCHMARK START =====/,/===== UML BENCHMARK END =====/p' uml.log || true
          grep -q '=== UML-ALPINE-TEST-PASSED ===' uml.log || { echo '::error::UML benchmark run failed'; exit 1; }
          echo "::notice::UML benchmark completed (Alpine $AVER, kernel $KVER, ${MEM}M RAM, ncpus=${NCPU}, optimized)"

      - name: Comparison notes
        if: always()
        run: |
          echo "Compare: NATIVE-HOST (Ubuntu userspace), NATIVE-ALPINE-CHROOT (same Alpine userspace, host kernel), UML (Alpine userspace, UML kernel)."
          echo "This isolates UML kernel/userspace-emulation overhead better (chroot vs UML share userspace/tools)."
