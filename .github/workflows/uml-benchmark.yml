name: uml-benchmark

on:
  workflow_dispatch:
    inputs:
      timeout_sec:
        description: 'Max seconds for the benchmark command (0 = no limit)'
        required: false
        default: '300'
        type: string

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          for i in $(seq 1 6); do
            sudo apt-get install -y bc bison flex libssl-dev libelf-dev wget xz-utils cpio jq dwarves && break
            sleep 20
          done

      - name: Resolve time limit
        env:
          TLIM_IN: ${{ inputs.timeout_sec }}
        run: |
          TLIM="$TLIM_IN"
          [ -z "$TLIM" ] && TLIM=300
          echo "CMDB64=$(printf '%s' 'echo benchmark' | base64 -w0)" >> "$GITHUB_ENV"
          echo "TLIM=$TLIM" >> "$GITHUB_ENV"
          echo "::notice::benchmark guest time limit: ${TLIM}s (0 = no limit)"

      - name: Resolve latest stable kernel
        run: |
          curl -fsSL https://www.kernel.org/releases.json -o releases.json
          KVER=$(jq -r '.latest_stable.version' releases.json)
          KURL=$(jq -r --arg v "$KVER" '.releases[] | select(.version==$v) | .source' releases.json | head -1)
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          echo "KURL=$KURL" >> "$GITHUB_ENV"

      - name: Download Linux kernel source
        run: |
          curl -fsSL "$KURL" | tar -xJ
          mv "linux-$KVER" linux-src

      - name: Assemble Alpine initramfs with benchmark script
        run: |
          AVER=$(curl -fsSL https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/ | grep -oP 'alpine-minirootfs-\K[0-9.]+(?=-x86_64\.tar\.gz)' | head -1)
          echo "AVER=$AVER" >> "$GITHUB_ENV"
          mkdir -p rootfs
          curl -fsSL "https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86_64/alpine-minirootfs-$AVER-x86_64.tar.gz" | tar -xz -C rootfs
          mkdir -p rootfs/proc rootfs/sys rootfs/dev
          cat > /tmp/init_net.sh <<'INIT'
          #!/bin/sh
          mount -t devtmpfs none /dev 2>/dev/null
          mount -t proc none /proc
          mount -t sysfs none /sys
          echo '=== ALPINE BOOTED INSIDE UML (benchmark) ==='
          cat /etc/alpine-release
          CMDB64=$(sed -n 's/.*cmdb64=\([^ ]*\).*/\1/p' /proc/cmdline)
          TLIM=$(sed -n 's/.*tlim=\([0-9]*\).*/\1/p' /proc/cmdline)
          [ -z "$TLIM" ] && TLIM=30
          if [ -x /run.sh ]; then
            CMD='/run.sh'
          elif [ -z "$CMDB64" ]; then
            CMD='echo hello'
          else
            CMD=$(printf '%s' "$CMDB64" | base64 -d)
          fi
          ifconfig lo 127.0.0.1 up 2>/dev/null || true
          NETIF=""
          i=0
          while [ "$i" -lt 30 ]; do
            for d in /sys/class/net/eth0 /sys/class/net/vec0; do
              if [ -e "$d" ]; then NETIF=$(basename "$d"); break; fi
            done
            [ -n "$NETIF" ] && break
            i=$((i+1))
            sleep 1
          done
          if [ -n "$NETIF" ]; then
            ifconfig "$NETIF" 10.0.2.15 netmask 255.255.255.0 up 2>/dev/null || ip addr add 10.0.2.15/24 dev "$NETIF" 2>/dev/null || true
            route add default gw 10.0.2.1 2>/dev/null || ip route add default via 10.0.2.1 2>/dev/null || true
          fi
          echo 'nameserver 1.1.1.1' > /etc/resolv.conf
          echo 'nameserver 8.8.8.8' >> /etc/resolv.conf
          echo "--- $NETIF ---"
          if [ -n "$NETIF" ]; then
            ifconfig "$NETIF" 2>/dev/null | grep -E 'inet |inet addr|HWaddr|ether' || true
          else
            echo "no network interface found"
          fi
          echo "--- route ---"
          route -n 2>/dev/null | head -5 || true
          if [ "$TLIM" = "0" ]; then
            echo "--- running custom cmd (no time limit): $CMD ---"
          else
            echo "--- running custom cmd (time limit ${TLIM}s): $CMD ---"
          fi
          if [ "$CMD" = "/run.sh" ]; then
            /bin/sh /run.sh &
          else
            sh -c "$CMD" &
          fi
          CPID=$!
          RC=124
          if [ "$TLIM" = "0" ]; then
            wait "$CPID"; RC=$?
          else
            i=0
            while [ "$i" -lt "$TLIM" ]; do
              i=$((i+1))
              kill -0 "$CPID" 2>/dev/null || break
              sleep 1
            done
            if kill -0 "$CPID" 2>/dev/null; then
              kill -9 "$CPID" 2>/dev/null
              wait "$CPID" 2>/dev/null
              echo "--- time limit reached (${TLIM}s), killed cmd ---"
              RC=124
            else
              wait "$CPID"; RC=$?
            fi
          fi
          echo "--- cmd exit code: $RC ---"
          if [ "$RC" -eq 0 ]; then
            echo '=== UML-ALPINE-TEST-PASSED ==='
          fi
          poweroff -f
          INIT
          # strip leading indentation from heredoc
          sed -i 's/^          //' /tmp/init_net.sh
          cp /tmp/init_net.sh rootfs/init
          chmod +x rootfs/init
          cat > rootfs/run.sh <<'BMRUN'
          #!/bin/sh
          set -e
          echo "===== UML BENCHMARK START ====="
          echo "kernel: $(uname -r)"
          echo "alpine: $(cat /etc/alpine-release 2>/dev/null || echo unknown)"
          echo "nproc: $(nproc)  processors: $(grep -c '^processor' /proc/cpuinfo 2>/dev/null || echo ?)"
          echo "mem_total_kb: $(grep MemTotal /proc/meminfo | awk '{print $2}')"
          echo "cpu_model: $(grep -m1 'model name' /proc/cpuinfo 2>/dev/null | cut -d: -f2 | sed 's/^ //' || echo unknown)"

          now_ms() { date +%s%3N 2>/dev/null || echo $(($(date +%s)*1000)); }

          echo "--- CPU: integer loop (200000 iters, sh arithmetic) ---"
          t0=$(now_ms)
          i=0; while [ "$i" -lt 200000 ]; do i=$((i+1)); done
          t1=$(now_ms); echo "cpu_loop_ms=$((t1-t0)) result=$i"

          echo "--- CPU: sha256sum 64 MiB from /dev/zero ---"
          t0=$(now_ms)
          dd if=/dev/zero bs=1M count=64 2>/dev/null | sha256sum >/tmp/sha.out
          t1=$(now_ms); echo "sha256_64MiB_ms=$((t1-t0))"; cat /tmp/sha.out

          echo "--- SYSCALL/PROC: fork+exec /bin/true 1000 times ---"
          t0=$(now_ms)
          i=0; while [ "$i" -lt 1000 ]; do /bin/true; i=$((i+1)); done
          t1=$(now_ms); echo "fork_exec_1000_ms=$((t1-t0))"

          echo "--- IO: write 64 MiB to /tmp (dd) ---"
          t0=$(now_ms)
          dd if=/dev/zero of=/tmp/iotest bs=1M count=64 conv=fsync 2>/dev/null
          t1=$(now_ms); echo "write_64MiB_ms=$((t1-t0))"

          echo "--- IO: read 64 MiB from /tmp ---"
          t0=$(now_ms)
          dd if=/tmp/iotest of=/dev/null bs=1M 2>/dev/null
          t1=$(now_ms); echo "read_64MiB_ms=$((t1-t0))"
          rm -f /tmp/iotest

          echo "--- NET: fetch example.com ---"
          t0=$(now_ms)
          wget -qO /tmp/bench.html http://example.com && echo "net_bytes=$(wc -c < /tmp/bench.html)"
          t1=$(now_ms); echo "net_fetch_ms=$((t1-t0))"

          echo "===== UML BENCHMARK END ====="
          BMRUN
          chmod +x rootfs/run.sh
          sudo mkdir -p rootfs/dev
          sudo mknod -m 600 rootfs/dev/console c 5 1
          sudo mknod -m 666 rootfs/dev/tty0 c 4 0
          sudo mknod -m 666 rootfs/dev/null c 1 3
          du -sh rootfs

      - name: Build UML kernel with Alpine embedded and vector net
        run: |
          cd linux-src
          make ARCH=um defconfig
          scripts/config --file .config -e BLK_DEV_INITRD -e RD_GZIP -e UML_NET -e UML_NET_VECTOR -e SMP --set-val NR_CPUS 8 --set-str INITRAMFS_SOURCE "$GITHUB_WORKSPACE/rootfs"
          make ARCH=um olddefconfig
          make ARCH=um -j"$(nproc)"
          ls -lh linux
          grep -E '^CONFIG_UML_NET_VECTOR=|^CONFIG_SMP=|^CONFIG_NR_CPUS=' .config

      - name: Set up host veth pair and NAT
        run: |
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo ip link add veth0 type veth peer name veth0p
          sudo ip addr add 10.0.2.1/24 dev veth0
          sudo ip link set veth0 up
          sudo ip link set veth0p up
          sudo iptables -t nat -A POSTROUTING -s 10.0.2.0/24 -o eth0 -j MASQUERADE
          sudo iptables -A FORWARD -i veth0 -o eth0 -j ACCEPT
          sudo iptables -A FORWARD -i eth0 -o veth0 -m state --state RELATED,ESTABLISHED -j ACCEPT

      - name: Boot UML and run benchmark
        timeout-minutes: 30
        run: |
          MIN=3072; MAX=3584; STEP=64
          N=$(( (MAX - MIN) / STEP + 1 ))
          MEM=$(( MIN + (RANDOM % N) * STEP ))
          NCPU=$(nproc)
          echo "::notice::benchmark alloc ${MEM}M RAM, ncpus=${NCPU}, tlim=${TLIM}"
          UMID=umlrun
          if [ "$TLIM" = "0" ]; then
            sudo stdbuf -oL -eL ./linux-src/linux umid=$UMID mem=${MEM}M ncpus=${NCPU} seccomp=on con0=fd:0,fd:1 cmdb64=$CMDB64 tlim=$TLIM > uml.log 2>&1 &
          else
            sudo stdbuf -oL -eL timeout $((TLIM + 180)) ./linux-src/linux umid=$UMID mem=${MEM}M ncpus=${NCPU} seccomp=on con0=fd:0,fd:1 cmdb64=$CMDB64 tlim=$TLIM > uml.log 2>&1 &
          fi
          UMLPID=$!
          MCSOCK=""
          UMID_DIR="/root/.uml/$UMID"
          for i in $(seq 1 90); do
            if sudo test -S "$UMID_DIR/mconsole"; then MCSOCK="$UMID_DIR/mconsole"; fi
            if [ -n "$MCSOCK" ] && sudo test -S "$MCSOCK"; then
              echo "mconsole socket: $MCSOCK"
              echo '' | base64 -d | sudo python3 - "$MCSOCK"
              break
            fi
            if [ $((i % 10)) -eq 0 ]; then echo "waiting for mconsole... (${i}s)"; fi
            sleep 1
          done
          wait $UMLPID || true
          echo "----- UML boot log -----"
          tail -200 uml.log
          echo "----- benchmark results -----"
          sed -n '/===== UML BENCHMARK START =====/,/===== UML BENCHMARK END =====/p' uml.log || true
          grep -q '=== UML-ALPINE-TEST-PASSED ===' uml.log || { echo '::error::benchmark run failed'; exit 1; }
          echo "::notice::benchmark completed (Alpine $AVER, kernel $KVER, ${MEM}M RAM, ncpus=${NCPU})"
